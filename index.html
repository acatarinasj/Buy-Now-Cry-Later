<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Buy Now Cry Later</title>
<link href="https://fonts.googleapis.com/css2?family=Aptos:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --g:#2D5A4A;--gm:#4A7A6A;--gl:#EAF2EE;
  --s:#C97B6A;--cr:#FAF7F4;--w:#FFFFFF;
  --t:#1E3A32;--su:#7A9A90;--b:#DDEAE4;
  --ff:'Aptos','Segoe UI',system-ui,sans-serif;
}
body{background:var(--cr);font-family:var(--ff);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;}
#loader{position:fixed;inset:0;background:var(--cr);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:999;gap:16px;}
#loader img{width:110px;height:110px;object-fit:contain;}
.spinner{width:26px;height:26px;border:3px solid var(--b);border-top-color:var(--g);
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-txt{font-size:12px;color:var(--su);}
#hdr{background:var(--cr);padding:12px 18px 10px;border-bottom:1px solid var(--b);display:flex;align-items:center;}
#hdr img{width:90px;height:90px;object-fit:contain;flex-shrink:0;}
#sync{width:8px;height:8px;border-radius:50%;background:var(--gm);margin-left:auto;flex-shrink:0;transition:background .3s;}
#sync.syn{background:var(--s);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
#tabs{display:flex;background:var(--w);border-bottom:2px solid var(--b);}
.tb{flex:1;padding:11px 0;font-size:10px;font-family:var(--ff);font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;
  cursor:pointer;color:var(--su);margin-bottom:-2px;transition:color .15s,border-color .15s;}
.tb.on{color:var(--g);border-bottom-color:var(--g);}
#body{padding:14px 14px 90px;}
.tp{display:none;}.tp.on{display:block;}
.ir{display:flex;gap:7px;margin-bottom:7px;align-items:center;position:relative;}
.inp{flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid var(--b);
  background:var(--w);font-size:14px;font-family:var(--ff);color:var(--t);outline:none;transition:border .15s;}
.inp:focus{border-color:var(--g);}
.inpf{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--b);
  background:var(--w);font-size:14px;font-family:var(--ff);color:var(--t);outline:none;}
.inpq{width:56px;padding:10px 6px;border-radius:9px;border:1.5px solid var(--b);
  background:var(--w);font-size:14px;text-align:center;font-family:var(--ff);color:var(--t);outline:none;}
.inps{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--b);
  background:var(--w);font-size:14px;font-family:var(--ff);color:var(--t);outline:none;margin-bottom:8px;}
.ba{padding:10px 15px;border-radius:9px;background:var(--g);color:var(--w);border:none;
  cursor:pointer;font-size:18px;font-weight:700;flex-shrink:0;}
#ac{position:absolute;top:calc(100% + 2px);left:0;right:66px;z-index:99;background:var(--w);
  border:1px solid var(--b);border-radius:9px;box-shadow:0 6px 20px rgba(45,90,74,.13);overflow:hidden;display:none;}
.aci{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--cr);color:var(--t);}
.aci:hover,.aci.hv{background:var(--gl);}
.ch{display:flex;align-items:center;gap:7px;padding:8px 0 4px;font-size:10px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--gm);cursor:pointer;user-select:none;}
.cb{background:var(--gl);color:var(--gm);border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;}
.it{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--w);
  border-radius:10px;margin-bottom:5px;box-shadow:0 1px 4px rgba(45,90,74,.07);border:1px solid var(--b);}
.it.dn{background:rgba(234,242,238,.4);opacity:.58;box-shadow:none;}
.itn{flex:1;font-size:14px;font-weight:500;}
.it.dn .itn{text-decoration:line-through;color:var(--su);}
.itq{font-size:11px;color:var(--su);background:var(--gl);border-radius:5px;padding:2px 6px;border:1px solid var(--b);}
.ite{display:flex;flex-direction:column;gap:7px;padding:10px 12px;background:var(--w);
  border-radius:10px;margin-bottom:5px;border:1.5px solid var(--g);}
.ck{width:20px;height:20px;border-radius:5px;border:2px solid var(--b);background:none;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ck.dn{border-color:var(--g);background:var(--g);}
.ckm{color:#fff;font-size:11px;font-weight:900;display:none;}
.ck.dn .ckm{display:block;}
.bt{background:none;border:none;cursor:pointer;font-size:10px;padding:2px 5px;border-radius:4px;
  font-family:var(--ff);font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.bp{width:100%;padding:12px;border-radius:10px;background:var(--g);color:var(--w);
  border:none;cursor:pointer;font-size:13px;font-weight:700;margin-top:8px;font-family:var(--ff);}
.bp:disabled{background:var(--b);color:var(--su);cursor:not-allowed;}
.bsal{width:100%;padding:11px;border-radius:10px;background:var(--s);color:var(--w);
  border:none;cursor:pointer;font-size:13px;font-weight:700;margin-top:8px;font-family:var(--ff);}
.bsc{width:100%;padding:10px;border-radius:10px;margin-top:6px;background:none;color:var(--g);
  border:1.5px solid var(--b);cursor:pointer;font-size:12px;font-family:var(--ff);}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--w);border:1px solid var(--b);
  border-radius:18px;padding:4px 12px;font-size:11px;margin:2px;cursor:pointer;font-family:var(--ff);font-weight:500;}
.tag.on{background:var(--g);color:var(--w);border-color:var(--g);}
.tag.sal{color:var(--s);border-color:var(--s);}
.st{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--su);margin-bottom:5px;margin-top:3px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;}
.chips{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.empty{text-align:center;padding:36px 0;color:var(--su);font-size:13px;line-height:1.8;}
.ov{position:fixed;inset:0;background:rgba(30,58,50,.5);z-index:200;display:none;align-items:flex-end;}
.ov.on{display:flex;}
.mo{background:var(--cr);border-radius:18px 18px 0 0;width:100%;max-width:480px;margin:0 auto;
  padding:20px 16px 32px;max-height:86vh;overflow-y:auto;box-shadow:0 -6px 30px rgba(45,90,74,.2);}
.mt{font-size:16px;font-weight:800;margin-bottom:2px;color:var(--g);}
.ms{font-size:12px;color:var(--su);margin-bottom:12px;}
.dc{background:var(--w);border-radius:12px;margin-bottom:10px;border:1px solid var(--b);overflow:hidden;box-shadow:0 1px 4px rgba(45,90,74,.06);}
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gl);cursor:pointer;}
.dn2{font-size:13px;font-weight:700;color:var(--g);}
.db{padding:10px 12px;}.db.col{display:none;}
.sc{background:var(--gl);border-radius:9px;padding:8px 10px;margin-bottom:6px;border:1px solid var(--b);}
.sn{font-size:13px;font-weight:700;}
.si{font-size:11px;color:var(--su);margin-top:3px;}
.dcb{display:inline-block;border-radius:5px;padding:1px 6px;font-size:9px;font-weight:700;color:#fff;margin-left:4px;}
.dicard{background:var(--w);border-radius:10px;border:1px solid var(--b);margin-bottom:8px;overflow:hidden;}
.dich{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;}
.dicb{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:3px;}
.ingr{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--b);}
.ingr:last-child{border-bottom:none;}
</style>
</head>

async function sbq(path,opts){
  opts=opts||{};
  setSyn(true);
  try{
    var prefer=opts.prefer||(opts.method==='POST'?'return=representation':'');
    var headers={apikey:SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':prefer};
    if(opts.headers) Object.assign(headers,opts.headers);
    var fetchOpts={method:opts.method||'GET',headers:headers};
    if(opts.body) fetchOpts.body=opts.body;
    var r=await fetch(SB+'/rest/v1/'+path,fetchOpts);
    setSyn(false);
    if(r.status===204||fetchOpts.method==='DELETE') return null;
    return await r.json();
  }catch(e){setSyn(false,'e');console.error(e);throw e;}
}
var sb={
  get:function(t,p){return sbq(t+'?'+(p||'')+'&order=created_at.desc');},
  ins:function(t,b){return sbq(t,{method:'POST',body:JSON.stringify(b),prefer:'return=representation'});},
  upd:function(t,id,b){return sbq(t+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(b),headers:{Prefer:'return=representation'}});},
  del:function(t,id){return sbq(t+'?id=eq.'+id,{method:'DELETE'});},
  ups:function(t,b){return sbq(t,{method:'POST',body:JSON.stringify(b),headers:{Prefer:'resolution=merge-duplicates,return=representation'}});}
};
function setSyn(on,st){

}

function gc(name){
  var n=name.toLowerCase().normalize('NFD').replace(/\p{Mn}/gu,'');
  for(var i=0;i<IC.length;i++){
    var c=IC[i];if(c.id==='outros')continue;
    for(var j=0;j<c.kw.length;j++){
      if(n.includes(c.kw[j].normalize('NFD').replace(/\p{Mn}/gu,'')))return c.id;
    }
  }
  return 'outros';
}
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function init(){
  try{
    var res=await Promise.all([
      sb.get('shopping_list'),sb.get('base_templates'),
      sbq('known_items?order=used_at.desc&limit=200'),
      sb.get('dishes'),sb.get('menu_slots')
    ]);
    list=res[0]||[];tpls=res[1]||[];
    known=(res[2]||[]).map(function(r){return r.name;});
    dishes=res[3]||[];slots=res[4]||[];
  }catch(e){console.error('Init error',e);}
  document.getElementById('loader').style.display='none';
  renderList();
}

function switchTab(id){
  document.querySelectorAll('.tp').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('tp-'+id).classList.add('on');
  var tabs=['list','menu','base'];
  var btns=document.querySelectorAll('.tb');
  tabs.forEach(function(t,i){if(t===id)btns[i].classList.add('on');});
  if(id==='list')renderList();
  if(id==='menu')renderEmenta();
  if(id==='base')renderBase();
}

async function addItem(){
  var name=document.getElementById('in').value.trim();
  var qty=document.getElementById('iq').value.trim()||'1';
  if(!name)return;
  var cat=gc(name);
  var ex=list.find(function(x){return x.name.toLowerCase()===name.toLowerCase();});
  if(ex){
    var nq=String(Number(ex.qty||1)+Number(qty));
    await sb.upd('shopping_list',ex.id,{qty:nq});ex.qty=nq;
  }else{
    var id=Date.now()+Math.floor(Math.random()*1000);
    var rows=await sb.ins('shopping_list',{id:id,name:name,qty:qty,done:false,cat:cat});
    var row=rows&&rows[0];
    list.unshift(row||{id:id,name:name,qty:qty,done:false,cat:cat});
  }
  await addKnown(name);
  document.getElementById('in').value='';document.getElementById('iq').value='1';
  hideAc();renderList();
}
async function addKnown(n){
  if(!n||known.includes(n))return;
  known=[n].concat(known).slice(0,200);
  await sb.ups('known_items',{name:n,used_at:new Date().toISOString()});
}
async function merge(ings){
  for(var i=0;i<ings.length;i++){
    var nm=ings[i].name,q=ings[i].qty;
    if(!nm)continue;nm=nm.trim();var cat=gc(nm);
    var idx=list.findIndex(function(x){return x.name.toLowerCase()===nm.toLowerCase();});
    if(idx>=0){
      var nq=String(Number(list[idx].qty||1)+(parseFloat(String(q).replace(/[^0-9.]/g,''))||1));
      await sb.upd('shopping_list',list[idx].id,{qty:nq});list[idx].qty=nq;
    }else{
      var id2=Date.now()+Math.floor(Math.random()*9999);
      var rows2=await sb.ins('shopping_list',{id:id2,name:nm,qty:String(q||'1'),done:false,cat:cat});
      var row2=rows2&&rows2[0];
      list.push(row2||{id:id2,name:nm,qty:String(q||'1'),done:false,cat:cat});
    }
    await addKnown(nm);
  }
  renderList();
}
async function toggleDone(id){
  var it=list.find(function(x){return x.id===id;});if(!it)return;
  it.done=!it.done;await sb.upd('shopping_list',id,{done:it.done});renderList();
}
async function remItem(id){
  list=list.filter(function(x){return x.id!==id;});
  await sb.del('shopping_list',id);renderList();
}
async function clearDone(){
  var ids=list.filter(function(x){return x.done;}).map(function(x){return x.id;});
  list=list.filter(function(x){return !x.done;});renderList();
  for(var i=0;i<ids.length;i++)await sb.del('shopping_list',ids[i]);
}
async function saveIE(id){
  var n=document.getElementById('en-'+id).value.trim();
  var q=document.getElementById('eq-'+id).value.trim()||'1';
  if(!n)return;
  var it=list.find(function(x){return x.id===id;});
  if(it){it.name=n;it.qty=q;it.cat=gc(n);}
  eid=null;await sb.upd('shopping_list',id,{name:n,qty:q,cat:gc(n)});renderList();
}

  var pend=list.filter(function(x){return !x.done;});
  var done=list.filter(function(x){return x.done;});
  document.getElementById('pc').textContent=
    pend.length===0&&done.length===0?'Sem itens. Adiciona algo acima.':
    pend.length+' item'+(pend.length!==1?'s':'')+' por comprar';
  var tc=document.getElementById('tpc');tc.innerHTML='';
  tpls.forEach(function(t){
    var b=document.createElement('button');b.className='tag';b.textContent=t.name;
    b.onclick=(function(tt){return function(){openABM(tt);};})(t);tc.appendChild(b);
  });
  if(done.length>0){
    var bd=document.createElement('button');bd.className='tag sal';bd.textContent='Limpar feitos';
    bd.onclick=clearDone;tc.appendChild(bd);
  }
  var byC={};
  pend.forEach(function(it){var c=it.cat||gc(it.name);if(!byC[c])byC[c]=[];byC[c].push(it);});
  var aC=IC.filter(function(c){return byC[c.id]&&byC[c.id].length>0;});
  var lc=document.getElementById('lc');lc.innerHTML='';
  aC.forEach(function(cat){
    var sec=document.createElement('div');
    var hd=document.createElement('div');hd.className='ch';
    hd.innerHTML='<span class="dot" style="background:'+cat.d+'"></span><span>'+cat.l+'</span>'+
      '<span class="cb">'+byC[cat.id].length+'</span>'+
      '<span style="margin-left:auto;font-size:12px;color:var(--su);">'+(colC[cat.id]?'&rsaquo;':'&#8964;')+'</span>';
    hd.onclick=(function(cid){return function(){colC[cid]=!colC[cid];renderList();};})(cat.id);
    sec.appendChild(hd);
    if(!colC[cat.id])byC[cat.id].forEach(function(it){sec.appendChild(mkItem(it));});
    lc.appendChild(sec);
  });
  var ds=document.getElementById('lds'),dl=document.getElementById('ld');
  if(done.length>0){ds.style.display='block';dl.innerHTML='';done.forEach(function(it){dl.appendChild(mkItem(it));});}
  else ds.style.display='none';
  document.getElementById('tmb').textContent='Ementa'+(slots.length>0?' ('+slots.length+')':'');
}
function mkItem(it){
  if(eid===it.id){
    var w=document.createElement('div');w.className='ite';
    w.innerHTML='<div class="ir"><input class="inp" id="en-'+it.id+'" value="'+h(it.name)+'"/>'+
      '<input class="inpq" id="eq-'+it.id+'" value="'+h(it.qty)+'"/></div>'+
      '<div style="display:flex;gap:6px;">'+
      '<button class="ba" style="padding:7px 14px;font-size:12px;" onclick="saveIE('+it.id+')">Guardar</button>'+
      '<button class="ba" style="padding:7px 14px;font-size:12px;background:var(--b);color:var(--su);" onclick="eid=null;renderList();">Cancelar</button></div>';
    return w;
  }
  var el=document.createElement('div');el.className='it'+(it.done?' dn':'');
  el.innerHTML='<button class="ck'+(it.done?' dn':'')+'" onclick="toggleDone('+it.id+')"><span class="ckm">&#10003;</span></button>'+
    '<span class="itn">'+h(it.name)+'</span><span class="itq">'+h(it.qty)+'</span>'+
    (!it.done?'<button class="bt" style="color:var(--gm);" onclick="eid='+it.id+';renderList();">editar</button>':'')+
    '<button class="bt" style="color:var(--s);" onclick="remItem('+it.id+')">&#215;</button>';
  return el;
}

function onNI(){
  var v=document.getElementById('in').value;
  if(v.length<2){hideAc();return;}
  var q=v.toLowerCase();
  acS=known.filter(function(i){return i.toLowerCase().includes(q)&&i.toLowerCase()!==q;}).slice(0,5);
  renderAc();
}
function renderAc(){
  var box=document.getElementById('ac');
  if(!acS.length){hideAc();return;}
  box.style.display='block';box.innerHTML='';
  acS.forEach(function(s,i){
    var d=document.createElement('div');d.className='aci'+(i===acH?' hv':'');d.textContent=s;
    d.onmousedown=(function(ss){return function(){document.getElementById('in').value=ss;hideAc();};})(s);
    d.onmouseenter=(function(ii){return function(){acH=ii;renderAc();};})(i);
    box.appendChild(d);
  });
}
function hideAc(){document.getElementById('ac').style.display='none';acS=[];acH=-1;}
function onNF(){if(document.getElementById('in').value.length>=2)renderAc();}
function onNB(){setTimeout(hideAc,150);}
function onNK(e){
  if(acS.length&&e.key==='ArrowDown'){e.preventDefault();acH=Math.min(acH+1,acS.length-1);renderAc();}
  else if(acS.length&&e.key==='ArrowUp'){e.preventDefault();acH=Math.max(acH-1,-1);renderAc();}
  else if(e.key==='Enter'){if(acH>=0){document.getElementById('in').value=acS[acH];hideAc();}else addItem();}
}

function openBM(tpl){
  beid=tpl?tpl.id:null;
  bit=tpl?tpl.items.map(function(i){return Object.assign({},i);}):[];
  document.getElementById('bmt').textContent=(tpl?'Editar':'Nova')+' Lista Base';
  document.getElementById('bn').value=tpl?tpl.name:'';
  document.getElementById('bin').value='';document.getElementById('biq').value='1';
  renderBIT();updBS();openM('bm');
}
function updBS(){document.getElementById('bsb').disabled=!document.getElementById('bn').value.trim()||!bit.length;}
function addBI(){
  var n=document.getElementById('bin').value.trim(),q=document.getElementById('biq').value.trim()||'1';
  if(!n)return;bit.push({name:n,qty:q});
  document.getElementById('bin').value='';document.getElementById('biq').value='1';
  renderBIT();updBS();
}
function renderBIT(){
  var el=document.getElementById('bil');el.innerHTML='';
  bit.forEach(function(it,i){
    var s=document.createElement('span');s.className='tag';
    s.innerHTML=h(it.name)+' &times;'+h(it.qty)+
      ' <span style="cursor:pointer;color:var(--s);margin-left:4px;font-weight:700;" onclick="bit.splice('+i+',1);renderBIT();updBS();">&#215;</span>';
    el.appendChild(s);
  });
}
async function saveBase(){
  var name=document.getElementById('bn').value.trim();if(!name||!bit.length)return;
  var id=beid||Date.now();
  if(beid){
    await sb.upd('base_templates',beid,{name:name,items:bit});
    tpls=tpls.map(function(t){return t.id===beid?Object.assign({},t,{name:name,items:bit}):t;});
  }else{
    var rows=await sb.ins('base_templates',{id:id,name:name,items:bit});
    tpls=[rows&&rows[0]||{id:id,name:name,items:bit}].concat(tpls);
  }
  closeM('bm');renderBase();renderList();
}
async function delTpl(id){
  tpls=tpls.filter(function(t){return t.id!==id;});
  await sb.del('base_templates',id);renderBase();renderList();
}
function openABM(tpl){
  document.getElementById('abmt').textContent=tpl.name;
  abit=tpl.items.map(function(i){return Object.assign({},i);});renderABI();openM('abm');
}
function renderABI(){
  var el=document.getElementById('abl');el.innerHTML='';
  abit.forEach(function(it,i){
    var r=document.createElement('div');r.style.cssText='display:flex;gap:7px;align-items:center;margin-bottom:7px;';

      '<button class="bt" style="color:var(--s);" onclick="abit.splice('+i+',1);renderABI();">&#215;</button>';
    el.appendChild(r);
  });
}
async function confAB(){await merge(abit);closeM('abm');}

  var el=document.getElementById('bl');el.innerHTML='';
  if(!tpls.length){el.innerHTML='<div class="empty">Sem listas base.<br>Cria uma lista que uses regularmente.</div>';return;}
  tpls.forEach(function(tpl){
    var card=document.createElement('div');

      '<div><button class="bt" style="color:var(--gm);" onclick=\'openBM(JSON.parse(this.dataset.t))\' data-t="'+tplJ+'">Editar</button>'+
      '<button class="bt" style="color:var(--s);" onclick="delTpl('+tpl.id+')">Remover</button></div></div>'+

      '<button class="bsc" style="margin-top:0;" onclick=\'openABM(JSON.parse(this.dataset.t))\' data-t="'+tplJ+'">Adicionar \u00e0 lista atual</button>';

function switchEV(v){
  ev=v;
  document.getElementById('ep').style.display=v==='plan'?'block':'none';
  document.getElementById('ed').style.display=v==='dishes'?'block':'none';
  document.getElementById('epb').className='tag'+(v==='plan'?' on':'');
  document.getElementById('edb').className='tag'+(v==='dishes'?' on':'');
  document.getElementById('edb').textContent='Pratos ('+dishes.length+')';
  if(v==='dishes')renderDishes();else renderPlan();
}
function renderEmenta(){if(ev==='plan')renderPlan();else renderDishes();}

function renderPlan(){
  document.getElementById('amtl').style.display=slots.length>0?'block':'none';
  var cnt=document.getElementById('daysc');cnt.innerHTML='';
  DAYS.forEach(function(day){
    var sl=slots.filter(function(s){return s.day===day;});
    var col=!!colD[day];
    var card=document.createElement('div');card.className='dc';
    var hd=document.createElement('div');hd.className='dh';
    hd.innerHTML='<span class="dn2">'+day+'</span>'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
      (sl.length>0?'<span style="font-size:11px;color:var(--gm);font-weight:600;">'+sl.length+' prato'+(sl.length!==1?'s':'')+'</span>':'')+
      '<span style="font-size:13px;color:var(--su);">'+(col?'&rsaquo;':'&#8964;')+'</span></div>';
    hd.onclick=(function(d){return function(){colD[d]=!colD[d];renderPlan();};})(day);
    card.appendChild(hd);
    var db=document.createElement('div');db.className='db'+(col?' col':'');
    if(!sl.length)db.innerHTML='<div style="color:var(--su);font-size:12px;margin-bottom:8px;">Sem pratos para este dia.</div>';
    sl.forEach(function(slot){
      var dish=dishes.find(function(d){return d.id===slot.dish_id;});
      var cat=DC.find(function(c){return c.id===(dish&&dish.cat);});
      var sc=document.createElement('div');sc.className='sc';
      sc.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'+
        '<div><span class="sn">'+h(dish&&dish.name||'Prato removido')+'</span>'+
        (cat?'<span class="dcb" style="background:'+cat.c+';">'+cat.l+'</span>':'')+'</div>'+
        '<div><button class="bt" style="color:var(--gm);" onclick="openSM('+slot.id+')">editar</button>'+
        '<button class="bt" style="color:var(--s);" onclick="remSlot('+slot.id+')">&#215;</button></div></div>'+
        '<div class="si">'+((slot.ing||[]).map(function(i){return h(i.name)+' '+h(i.qty);}).join(' &middot; '))+'</div>';
      db.appendChild(sc);
    });
    var ab=document.createElement('button');ab.className='tag';
    ab.style.cssText='margin-top:4px;color:var(--g);border-color:var(--g);';
    ab.textContent='+ Adicionar prato';
    ab.onclick=(function(d){return function(){openADM(d);};})(day);
    db.appendChild(ab);card.appendChild(db);cnt.appendChild(card);
  });
}
async function remSlot(id){
  slots=slots.filter(function(s){return s.id!==id;});
  await sb.del('menu_slots',id);renderPlan();
  document.getElementById('tmb').textContent='Ementa'+(slots.length>0?' ('+slots.length+')':'');
}
function openSM(slotId){
  var slot=slots.find(function(s){return s.id===slotId;});if(!slot)return;
  slid=slotId;slit=(slot.ing||[]).map(function(i){return Object.assign({},i);});
  document.getElementById('slotms').textContent=slot.day+' \u2014 ajusta as quantidades para esta semana.';
  document.getElementById('slin').value='';document.getElementById('sliq').value='1';
  renderSI();openM('slotm');
}
function renderSI(){
  var el=document.getElementById('slotil');el.innerHTML='';
  slit.forEach(function(it,i){
    var r=document.createElement('div');r.style.cssText='display:flex;gap:7px;align-items:center;margin-bottom:7px;';
    r.innerHTML='<input class="inp" style="flex:1;" value="'+h(it.name)+'" oninput="slit['+i+'].name=this.value"/>'+
      '<input class="inpq" value="'+h(it.qty)+'" oninput="slit['+i+'].qty=this.value"/>'+
      '<button class="bt" style="color:var(--s);" onclick="slit.splice('+i+',1);renderSI();">&#215;</button>';
    el.appendChild(r);
  });
}
function addSI(){
  var n=document.getElementById('slin').value.trim(),q=document.getElementById('sliq').value.trim()||'1';
  if(!n)return;slit.push({name:n,qty:q});
  document.getElementById('slin').value='';document.getElementById('sliq').value='1';renderSI();
}
async function saveSlot(){
  if(!slid)return;
  var slot=slots.find(function(s){return s.id===slid;});if(slot)slot.ing=slit;
  await sb.upd('menu_slots',slid,{ing:slit});closeM('slotm');renderPlan();
}
function openADM(day){
  addDay=day;
  document.getElementById('amdt').textContent='Adicionar prato \u2014 '+day;
  var el=document.getElementById('amdl');el.innerHTML='';
  if(!dishes.length){el.innerHTML='<div class="empty">Sem pratos. Cria um prato em Ementa &rarr; Pratos.</div>';openM('addm');return;}
  DC.forEach(function(cat){
    var cd=dishes.filter(function(d){return d.cat===cat.id;});if(!cd.length)return;
    var sec=document.createElement('div');sec.style.marginBottom='12px';
    sec.innerHTML='<div class="st" style="color:'+cat.c+';">'+cat.l+'</div>';
    cd.forEach(function(d){
      var card=document.createElement('div');
      card.style.cssText='background:var(--w);border-radius:10px;padding:10px 12px;margin-bottom:5px;border:1px solid var(--b);cursor:pointer;';
      card.innerHTML='<div style="font-weight:700;font-size:14px;">'+h(d.name)+'</div>'+
        '<div style="font-size:11px;color:var(--su);margin-top:2px;">'+((d.ing||[]).map(function(i){return h(i.name)+' '+h(i.qty);}).join(' &middot; '))+'</div>';
      card.onclick=(function(dd){return async function(){
        var ing=(dd.ing||[]).map(function(i){return Object.assign({},i);});
        var rows=await sb.ins('menu_slots',{day:addDay,dish_id:dd.id,ing:ing});
        slots.push(rows&&rows[0]||{id:Date.now(),day:addDay,dish_id:dd.id,ing:ing});
        closeM('addm');renderPlan();
        document.getElementById('tmb').textContent='Ementa'+(slots.length>0?' ('+slots.length+')':'');
      };})(d);
      sec.appendChild(card);
    });el.appendChild(sec);
  });openM('addm');
}
async function addMenuToList(){
  var all=[];
  slots.forEach(function(s){(s.ing||[]).forEach(function(i){all.push({name:i.name,qty:i.qty});});});
  await merge(all);switchTab('list');
}

function renderDishes(){
  document.getElementById('edb').textContent='Pratos ('+dishes.length+')';
  var el=document.getElementById('dl');el.innerHTML='';
  if(!dishes.length){el.innerHTML='<div class="empty">Sem pratos.<br>Cria o teu primeiro prato.</div>';return;}
  DC.forEach(function(cat){
    var cd=dishes.filter(function(d){return d.cat===cat.id;});if(!cd.length)return;
    var sec=document.createElement('div');sec.style.marginTop='14px';
    sec.innerHTML='<div class="st" style="color:'+cat.c+';">'+cat.l+'</div>';
    cd.forEach(function(d){
      var card=document.createElement('div');card.className='dicard';
      var tags=(d.ing||[]).map(function(it){return '<span class="tag" style="font-size:11px;padding:2px 9px;">'+h(it.name)+'<span style="color:var(--gm);font-weight:600;margin-left:3px;">&times;'+h(it.qty)+'</span></span>';}).join('');
      var dJ=JSON.stringify(d).replace(/"/g,'&quot;');
      card.innerHTML='<div class="dich"><div><span style="font-size:14px;font-weight:700;">'+h(d.name)+'</span>'+
        '<span class="dcb" style="background:'+cat.c+';margin-left:6px;">'+cat.l+'</span></div>'+
        '<div><button class="bt" style="color:var(--gm);" onclick=\'openDM(JSON.parse(this.dataset.d))\' data-d="'+dJ+'">editar</button>'+
        '<button class="bt" style="color:var(--s);" onclick="delDish('+d.id+')">remover</button></div></div>'+
        '<div class="dicb">'+tags+'</div>';
      sec.appendChild(card);
    });el.appendChild(sec);
  });
}
function updDS(){document.getElementById('dsb').disabled=!document.getElementById('dn').value.trim()||!dit.length;}
function openDM(dish){
  deid=dish?dish.id:null;
  dit=dish?(dish.ing||[]).map(function(i){return Object.assign({},i);}):[];
  document.getElementById('dmt').textContent=(dish?'Editar':'Novo')+' Prato';
  document.getElementById('dn').value=dish?dish.name:'';
  document.getElementById('dc').value=dish?dish.cat:'peixe';
  document.getElementById('din').value='';document.getElementById('diq').value='1';
  renderDI();updDS();openM('dm');
}
function addDI(){
  var n=document.getElementById('din').value.trim(),q=document.getElementById('diq').value.trim()||'1';
  if(!n)return;dit.push({name:n,qty:q});
  document.getElementById('din').value='';document.getElementById('diq').value='1';
  renderDI();updDS();
}
function renderDI(){
  var el=document.getElementById('dil');el.innerHTML='';
  if(!dit.length){el.innerHTML='<div style="color:var(--su);font-size:12px;padding:6px 0;">Sem ingredientes ainda.</div>';return;}
  dit.forEach(function(it,i){
    var r=document.createElement('div');r.className='ingr';
    r.innerHTML='<input class="inp" style="flex:1;padding:6px 10px;font-size:13px;" value="'+h(it.name)+'" oninput="dit['+i+'].name=this.value"/>'+
      '<input class="inpq" style="width:50px;padding:6px 5px;font-size:13px;" value="'+h(it.qty)+'" oninput="dit['+i+'].qty=this.value"/>'+
      '<button class="bt" style="color:var(--s);" onclick="dit.splice('+i+',1);renderDI();updDS();">&#215;</button>';
    el.appendChild(r);
  });
}
async function saveDish(){
  var name=document.getElementById('dn').value.trim(),cat=document.getElementById('dc').value;
  if(!name||!dit.length)return;var id=deid||Date.now();
  if(deid){
    await sb.upd('dishes',deid,{name:name,cat:cat,ing:dit});
    dishes=dishes.map(function(d){return d.id===deid?Object.assign({},d,{name:name,cat:cat,ing:dit}):d;});
  }else{
    var rows=await sb.ins('dishes',{id:id,name:name,cat:cat,ing:dit});
    dishes=[rows&&rows[0]||{id:id,name:name,cat:cat,ing:dit}].concat(dishes);
  }
  closeM('dm');renderDishes();
}
async function delDish(id){
  dishes=dishes.filter(function(d){return d.id!==id;});
  slots=slots.filter(function(s){return s.dish_id!==id;});
  await sb.del('dishes',id);renderDishes();renderPlan();
}

function openM(id){document.getElementById(id).classList.add('on');}
function closeM(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.ov').forEach(function(o){
  o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('on');});
});

init();
</script>
</body>
</html>
